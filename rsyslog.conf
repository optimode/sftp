# ===========================================================================
#  rsyslog configuration -- Optimode SFTP
#
#  - sshd writes to the local /dev/log socket (syslog AUTH)
#  - every message goes into a DAILY file:  /var/log/sftp/sshd-YYYYMMDD.log
#  - the same message is also mirrored to stdout so `docker logs` keeps working
#  - the timestamp is RFC3339 (with year and timezone), e.g.:
#        2026-11-16T10:30:00.123456+01:00
# ===========================================================================

global(workDirectory="/var/spool/rsyslog")

# Create the local syslog socket (/dev/log) that sshd writes to.
module(load="imuxsock" SysSock.Use="on" SysSock.Name="/dev/log")

# stdout output module (for `docker logs` -- must be loaded explicitly)
module(load="omstdout")

# --- templates --------------------------------------------------------------
# File format: <RFC3339 time> <host> <program>[<pid>]: <message>
template(name="sftpFile" type="string"
         string="%timegenerated:::date-rfc3339% %hostname% %programname%[%procid%]:%msg:::drop-last-lf%\n")

# Stdout format (docker logs): <RFC3339 time> <program>[<pid>]: <message>
template(name="sftpStdout" type="string"
         string="%timegenerated:::date-rfc3339% %programname%[%procid%]:%msg:::drop-last-lf%\n")

# Daily filename: /var/log/sftp/sshd-YYYYMMDD.log
template(name="sftpDyn" type="string"
         string="/var/log/sftp/sshd-%$YEAR%%$MONTH%%$DAY%.log")

# --- actions ----------------------------------------------------------------
# 1) into the daily file (persistent; rotation = daily rollover)
*.* action(type="omfile"
           dynaFile="sftpDyn"
           template="sftpFile"
           createDirs="on"
           fileCreateMode="0644"
           dirCreateMode="0755")

# 2) also to stdout (for `docker logs`)
*.* action(type="omstdout" template="sftpStdout")
